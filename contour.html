<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magical Picture Explorer</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            margin: 0;
            height: 100vh;
            height: 100dvh; /* Adapts dynamically to visible UI screen changes on mobile */
            overflow: hidden;
            position: relative;
        }
        
        /* --- Canvas Display Wrapper --- */
        .canvas-area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 64px; /* Desktop control bar height safety cushion */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 15px;
        }
        .canvas-container {
            position: relative;
            display: inline-block;
        }
        canvas {
            display: block;
            touch-action: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 12px;
            max-width: 100%;
            max-height: 100%;
        }
        #sparkleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
        }

        /* --- Hardened Fixed Position Control Bar --- */
        .control-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: #ffffff;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
            z-index: 1000; /* Keeps layout locked explicitly above canvas surfaces */
        }
        
        .divider {
            width: 1px;
            height: 28px;
            background: #e0e0e0;
        }

        /* Group Containers */
        .btn-group, .dynamic-settings, .action-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dynamic-settings {
            flex-grow: 1;
            justify-content: center;
        }

        /* Round Compact Buttons */
        .icon-btn, .file-label, .tool-btn {
            background: #f0f2f5;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:active, .file-label:active, .tool-btn:active {
            background: #dcdfe3;
        }
        .tool-btn.active {
            background: #222222;
            transform: scale(1.05);
        }
        .icon-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        input[type="file"] {
            display: none; 
        }

        /* Inline Tool Settings Grouping */
        .setting-group {
            display: none;
            align-items: center;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }
        .setting-group.active {
            display: flex;
        }

        /* Color Pots Engine */
        .color-palette {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .color-pot-wrapper {
            position: relative;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: transform 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .color-pot-wrapper.active {
            border-color: #222222;
            transform: scale(1.15);
        }
        input[type="color"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .color-display {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
        }

        /* Sliders */
        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: bold;
            color: #555;
        }
        input[type="range"] {
            width: 90px;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            outline: none;
            accent-color: #222;
        }

        /* --- Smart Mobile Adaptive Viewport Rules --- */
        @media (max-width: 600px) {
            .canvas-area {
                bottom: 115px; /* Clear out larger structural spacing for dual rows */
            }

            .control-bar {
                height: auto; 
                flex-wrap: wrap; /* Permits safe row wrapping on tight viewport screens */
                padding: 10px 12px;
                padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); /* Padding safe guard for device navigation indicators */
                gap: 8px 4px;
            }
            
            .divider {
                display: none; /* Strip standard layout dividers on compressed mobile paths */
            }

            .icon-btn, .file-label, .tool-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            .dynamic-settings {
                width: 100%;
                order: 2; /* Drops coloring selectors onto clear separate row line */
                background: #f7f9fa;
                padding: 6px;
                border-radius: 20px;
                margin-top: 2px;
            }

            .setting-group {
                gap: 8px 12px;
            }

            input[type="range"] {
                width: 75px; 
            }
        }
    </style>
</head>
<body>

    <div class="canvas-area" id="canvasArea">
        <div class="canvas-container">
            <canvas id="mainCanvas"></canvas>
            <canvas id="sparkleCanvas"></canvas>
        </div>
    </div>

    <div class="control-bar">
        
        <label class="file-label" title="Open Picture">
            📁
            <input type="file" id="imageLoader" accept="image/*">
        </label>

        <div class="divider"></div>

        <div class="btn-group">
            <button id="toolHighlight" class="tool-btn active" title="Highlighter">🖍️</button>
            <button id="toolPencil" class="tool-btn" title="Magic Pencil">✨</button>
        </div>

        <div class="divider"></div>

        <div class="dynamic-settings">
            
            <div id="highlighterSettings" class="setting-group active">
                <div class="color-palette" id="highlighterPots">
                    <div class="color-pot-wrapper active"><div class="color-display" style="background: #ffe600;"></div><input type="color" value="#ffe600"></div>
                    <div class="color-pot-wrapper"><div class="color-display" style="background: #ff3399;"></div><input type="color" value="#ff3399"></div>
                    <div class="color-pot-wrapper"><div class="color-display" style="background: #00e5ff;"></div><input type="color" value="#00e5ff"></div>
                    <div class="color-pot-wrapper"><div class="color-display" style="background: #33ff33;"></div><input type="color" value="#33ff33"></div>
                </div>
                <div class="slider-wrap">
                    <span>Edge</span>
                    <input type="range" id="tolerance" min="10" max="150" value="65">
                </div>
            </div>

            <div id="pencilSettings" class="setting-group">
                <div class="color-pot-wrapper active">
                    <div class="color-display" id="pencilColorDisplay" style="background: #FFD700;"></div>
                    <input type="color" id="pencilColorPicker" value="#FFD700">
                </div>
                <div class="slider-wrap">
                    <span>Size</span>
                    <input type="range" id="pencilSize" min="2" max="25" value="8">
                </div>
            </div>
            
        </div>

        <div class="divider"></div>

        <div class="action-group">
            <button id="undoBtn" class="icon-btn" disabled title="Undo">↩️</button>
            <button id="redoBtn" class="icon-btn" disabled title="Redo">↪️</button>
            <button id="clearBtn" class="icon-btn" title="Clear Markups">🗑️</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const sCanvas = document.getElementById('sparkleCanvas');
        const sCtx = sCanvas.getContext('2d');
        const canvasArea = document.getElementById('canvasArea');
        const imageLoader = document.getElementById('imageLoader');

        let activeTool = 'highlighter'; 
        let activeHighlighterColor = '#ffe600';
        let activePencilColor = '#FFD700';

        let undoStack = [];
        let redoStack = [];
        let originalBaseImage = null; 
        let currentLoadedImage = null; // Track current file across visual window transformations
        
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let sparkles = []; 
        let lastWindowWidth = window.innerWidth;

        // --- Core Setup & Geometry Fits ---
        function initCanvas() {
            fitCanvasToContainer(null); 
            requestAnimationFrame(animateSparkles);
        }

        function fitCanvasToContainer(uploadedImg) {
            currentLoadedImage = uploadedImg;
            const padding = 30;
            const maxWidth = canvasArea.clientWidth - padding;
            const maxHeight = canvasArea.clientHeight - padding;
            
            let w = maxWidth;
            let h = maxHeight;

            if (uploadedImg) {
                let ratio = Math.min(maxWidth / uploadedImg.width, maxHeight / uploadedImg.height);
                w = Math.floor(uploadedImg.width * ratio);
                h = Math.floor(uploadedImg.height * ratio);
                
                canvas.width = w; canvas.height = h;
                sCanvas.width = w; sCanvas.height = h;
                ctx.drawImage(uploadedImg, 0, 0, w, h);
            } else {
                canvas.width = w; canvas.height = h;
                sCanvas.width = w; sCanvas.height = h;
                drawSampleScene(w, h);
            }

            originalBaseImage = ctx.getImageData(0, 0, w, h);
            undoStack = [];
            redoStack = [];
            saveState();
            updateCursor();
        }

        function drawSampleScene(w, h) {
            ctx.fillStyle = '#8B5A2B'; ctx.fillRect(0, 0, w, h); 
            ctx.fillStyle = '#A0522D';
            for(let i=0; i<w; i+=40) ctx.fillRect(i, 0, 2, h); 
            ctx.lineWidth = 3; ctx.strokeStyle = '#222';
            
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(w/2 - 120, h/2 - 60, 80, 80); ctx.strokeRect(w/2 - 120, h/2 - 60, 80, 80);
            ctx.beginPath(); ctx.arc(w/2 + 60, h/2 + 20, 45, 0, Math.PI*2); ctx.fillStyle = '#3498db'; ctx.fill(); ctx.stroke();
        }

        // --- Handle File Upload Rendering Hooks ---
        imageLoader.addEventListener('change', function(e) {
            if (!e.target.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    fitCanvasToContainer(img);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // --- Context / Tool Switching Core Logics ---
        const btnHighlight = document.getElementById('toolHighlight');
        const btnPencil = document.getElementById('toolPencil');
        const settingsHighlight = document.getElementById('highlighterSettings');
        const settingsPencil = document.getElementById('pencilSettings');

        btnHighlight.addEventListener('click', () => {
            btnHighlight.classList.add('active'); btnPencil.classList.remove('active');
            settingsHighlight.classList.add('active'); settingsPencil.classList.remove('active');
            activeTool = 'highlighter'; updateCursor();
        });

        btnPencil.addEventListener('click', () => {
            btnPencil.classList.add('active'); btnHighlight.classList.remove('active');
            settingsPencil.classList.add('active'); settingsHighlight.classList.remove('active');
            activeTool = 'pencil'; updateCursor();
        });

        const highlightWrappers = document.querySelectorAll('#highlighterPots .color-pot-wrapper');
        highlightWrappers.forEach(wrapper => {
            const input = wrapper.querySelector('input');
            const display = wrapper.querySelector('.color-display');
            wrapper.addEventListener('click', () => {
                highlightWrappers.forEach(w => w.classList.remove('active'));
                wrapper.classList.add('active');
                activeHighlighterColor = input.value; updateCursor();
            });
            input.addEventListener('input', (e) => {
                display.style.background = e.target.value;
                activeHighlighterColor = e.target.value; wrapper.click();
            });
        });

        const pencilInput = document.getElementById('pencilColorPicker');
        const pencilDisplay = document.getElementById('pencilColorDisplay');
        pencilInput.addEventListener('input', (e) => {
            pencilDisplay.style.background = e.target.value;
            activePencilColor = e.target.value; updateCursor();
        });

        // --- Interaction Coordination Engine ---
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor((e.clientX - rect.left) * (canvas.width / rect.width)),
                y: Math.floor((e.clientY - rect.top) * (canvas.height / rect.height))
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            const pos = getPos(e);
            saveState();

            if (activeTool === 'highlighter') {
                const tol = parseInt(document.getElementById('tolerance').value);
                floodFill(pos.x, pos.y, activeHighlighterColor, tol);
            } else {
                isDrawing = true; lastX = pos.x; lastY = pos.y;
                drawPencilStroke(pos.x, pos.y);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || activeTool !== 'pencil') return;
            const pos = getPos(e);
            drawPencilStroke(pos.x, pos.y);
        });

        window.addEventListener('pointerup', () => { isDrawing = false; });

        function drawPencilStroke(x, y) {
            const size = document.getElementById('pencilSize').value;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.lineWidth = size; ctx.strokeStyle = activePencilColor;
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            if (Math.random() > 0.2) spawnSparkle(x, y, activePencilColor);
            lastX = x; lastY = y;
        }

        // --- Particle Sparkle Systems & Flood Fills ---
        function spawnSparkle(x, y, color) {
            for(let i=0; i<2; i++) {
                sparkles.push({
                    x: x + (Math.random() - 0.5) * 15,
                    y: y + (Math.random() - 0.5) * 15,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8 - 0.3, 
                    size: Math.random() * 2.5 + 1,
                    life: 1.0,
                    decay: Math.random() * 0.03 + 0.01,
                    color: color
                });
            }
        }

        function animateSparkles() {
            sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
            for (let i = sparkles.length - 1; i >= 0; i--) {
                let sp = sparkles[i];
                sp.x += sp.vx; sp.y += sp.vy; sp.life -= sp.decay;
                if (sp.life <= 0) { sparkles.splice(i, 1); continue; }

                sCtx.globalAlpha = sp.life * (0.3 + 0.7 * Math.sin(Date.now() * 0.02 + sp.x));
                sCtx.fillStyle = '#FFF'; sCtx.beginPath(); sCtx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2); sCtx.fill();
                sCtx.fillStyle = sp.color; sCtx.globalAlpha = sp.life * 0.3; sCtx.beginPath(); sCtx.arc(sp.x, sp.y, sp.size * 2, 0, Math.PI * 2); sCtx.fill();
            }
            sCtx.globalAlpha = 1.0;
            requestAnimationFrame(animateSparkles);
        }

        function floodFill(startX, startY, hexColor, tolerance) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const w = canvas.width, h = canvas.height;
            const startPos = (startY * w + startX) * 4;
            
            const startR = data[startPos], startG = data[startPos+1], startB = data[startPos+2];
            const match = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hexColor);
            const targetColor = match ? { r: parseInt(match[1], 16), g: parseInt(match[2], 16), b: parseInt(match[3], 16) } : { r:255, g:255, b:0 };

            const alpha = 130; 
            const visited = new Uint8Array(w * h);
            const stack = [startX, startY];

            while (stack.length > 0) {
                const y = stack.pop(), x = stack.pop();
                const idx = y * w + x;
                if (visited[idx]) continue;

                const pos = idx * 4;
                const colorDiff = Math.abs(data[pos] - startR) + Math.abs(data[pos+1] - startG) + Math.abs(data[pos+2] - startB);

                if (colorDiff <= tolerance) {
                    visited[idx] = 1;
                    data[pos]   = (data[pos] * (255 - alpha) + targetColor.r * alpha) / 255;
                    data[pos+1] = (data[pos+1] * (255 - alpha) + targetColor.g * alpha) / 255;
                    data[pos+2] = (data[pos+2] * (255 - alpha) + targetColor.b * alpha) / 255;

                    if (x > 0) stack.push(x - 1, y);
                    if (x < w - 1) stack.push(x + 1, y);
                    if (y > 0) stack.push(x, y - 1);
                    if (y < h - 1) stack.push(x, y + 1);
                } else {
                    visited[idx] = 1; 
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // --- History States & Dynamic Cursors ---
        function saveState() {
            if (undoStack.length > 20) undoStack.shift();
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            redoStack = []; updateButtons();
        }

        // Fix logic errors where pop resets were wiping tracking matrices
        function undo() {
            if (undoStack.length > 1) {
                redoStack.push(undoStack.pop());
                ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
                updateButtons();
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                const nextState = redoStack.pop();
                undoStack.push(nextState);
                ctx.putImageData(nextState, 0, 0);
                updateButtons();
            }
        }

        function updateButtons() {
            document.getElementById('undoBtn').disabled = undoStack.length <= 1;
            document.getElementById('redoBtn').disabled = redoStack.length === 0;
        }

        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('redoBtn').addEventListener('click', redo);
        document.getElementById('clearBtn').addEventListener('click', () => {
            saveState(); ctx.putImageData(originalBaseImage, 0, 0);
        });

        function updateCursor() {
            if (activeTool === 'highlighter') {
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20" stroke="${encodeURIComponent(activeHighlighterColor)}" stroke-width="3" stroke-linecap="round"/></svg>`;
                canvas.style.cursor = `url('data:image/svg+xml;utf8,${svg}') 12 12, crosshair`;
            } else {
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M7.127 22.562l-7.127 1.438 1.438-7.128 5.689 5.69zm1.414-1.414l11.228-11.225-5.69-5.692-11.227 11.227 5.689 5.69z" fill="${encodeURIComponent(activePencilColor)}" stroke="%23000" stroke-width="1"/></svg>`;
                canvas.style.cursor = `url('data:image/svg+xml;utf8,${svg}') 0 24, crosshair`;
            }
        }

        window.onload = initCanvas;

        // Shields mobile view canvas from micro-shuffles triggered by sliding address bars
        window.addEventListener('resize', () => {
            if (window.innerWidth === lastWindowWidth) return;
            lastWindowWidth = window.innerWidth;
            fitCanvasToContainer(currentLoadedImage);
        });
    </script>
</body>
</html>
