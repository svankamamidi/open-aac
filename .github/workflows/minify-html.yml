name: Build and Deploy Minified HTML to GitHub Pages

on:
  push:
    branches:
      - search_for_picture
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --save-dev html-minifier-terser glob

      - name: Create minify script
        run: |
          mkdir -p build
          cat > build/minify.js << 'EOF'
          const minify = require('html-minifier-terser').minify;
          const fs = require('fs');
          const path = require('path');
          const glob = require('glob');

          async function minifyHTMLFiles() {
            const htmlFiles = glob.sync('*.html', {
              ignore: 'node_modules/**'
            });

            if (htmlFiles.length === 0) {
              console.log('No HTML files found');
              return;
            }

            console.log(`Found ${htmlFiles.length} HTML file(s) to minify`);

            for (const file of htmlFiles) {
              try {
                const html = fs.readFileSync(file, 'utf-8');
                const originalSize = Buffer.byteLength(html, 'utf8');

                const minified = await minify(html, {
                  minifyJS: true,
                  minifyCSS: true,
                  removeComments: true,
                  collapseWhitespace: true,
                  removeAttributeQuotes: false,
                  removeRedundantAttributes: true,
                  conservativeCollapse: true,
                  collapseBooleanAttributes: true,
                  removeEmptyAttributes: true
                });

                const minifiedSize = Buffer.byteLength(minified, 'utf8');
                const reduction = ((1 - minifiedSize / originalSize) * 100).toFixed(2);

                fs.mkdirSync(path.dirname(path.join('dist', file)), { recursive: true });
                fs.writeFileSync(path.join('dist', file), minified);

                console.log(`✓ ${file} (${reduction}% smaller)`);
              } catch (error) {
                console.error(`✗ Error minifying ${file}:`, error.message);
                process.exit(1);
              }
            }
          }

          minifyHTMLFiles().catch(error => {
            console.error('Fatal error:', error);
            process.exit(1);
          });
          EOF

      - name: Minify HTML files
        run: node build/minify.js

      - name: Copy supporting files
        run: |
          mkdir -p dist
          # Copy service worker
          [ -f sw.js ] && cp sw.js dist/ || echo "sw.js not found"
          # Copy manifest
          [ -f manifest.json ] && cp manifest.json dist/ || echo "manifest.json not found"
          # Copy icons directory
          [ -d icons ] && cp -r icons dist/ || echo "icons directory not found"
          # Copy any JSON config files
          find . -maxdepth 1 -name "*.json" -type f ! -path "./node_modules/*" -exec cp {} dist/ \;

      - name: Verify dist contents
        run: |
          echo "=== Files in dist/ ==="
          ls -lah dist/
          echo "=== HTML files ==="
          find dist -name "*.html" -type f

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
