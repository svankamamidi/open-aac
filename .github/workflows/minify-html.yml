name: Build and Deploy Minified HTML to GitHub Pages

on:
  push:
    branches:
      - search_for_picture
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --save-dev html-minifier-terser glob

      - name: Create build directory
        run: mkdir -p build dist

      - name: Create minify script
        run: |
          cat > build/minify.js << 'MINIFY_EOF'
          const minify = require('html-minifier-terser').minify;
          const fs = require('fs');
          const path = require('path');
          const glob = require('glob');

          async function minifyHTMLFiles() {
            const htmlFiles = glob.sync('*.html', {
              ignore: 'node_modules/**'
            });

            if (htmlFiles.length === 0) {
              console.log('No HTML files found');
              return;
            }

            console.log(`Found ${htmlFiles.length} HTML file(s) to minify`);

            for (const file of htmlFiles) {
              try {
                const html = fs.readFileSync(file, 'utf-8');
                const originalSize = Buffer.byteLength(html, 'utf8');

                const minified = await minify(html, {
                  minifyJS: true,
                  minifyCSS: true,
                  removeComments: true,
                  collapseWhitespace: true,
                  removeAttributeQuotes: false,
                  removeRedundantAttributes: true,
                  conservativeCollapse: true,
                  collapseBooleanAttributes: true,
                  removeEmptyAttributes: true
                });

                const minifiedSize = Buffer.byteLength(minified, 'utf8');
                const reduction = ((1 - minifiedSize / originalSize) * 100).toFixed(2);

                const outputPath = path.join('dist', file);
                fs.mkdirSync(path.dirname(outputPath), { recursive: true });
                fs.writeFileSync(outputPath, minified);

                console.log(`✓ ${file}`);
                console.log(`  Original: ${originalSize} bytes → Minified: ${minifiedSize} bytes (${reduction}% reduction)`);
              } catch (error) {
                console.error(`✗ Error minifying ${file}:`, error.message);
                process.exit(1);
              }
            }

            console.log('\n✓ All HTML files minified successfully!');
          }

          minifyHTMLFiles().catch(error => {
            console.error('Fatal error:', error);
            process.exit(1);
          });
          MINIFY_EOF

      - name: Minify HTML files
        run: node build/minify.js

      - name: Copy supporting files
        run: |
          # Copy service worker
          if [ -f sw.js ]; then
            cp sw.js dist/
            echo "✓ Copied sw.js"
          fi
          
          # Copy manifest
          if [ -f manifest.json ]; then
            cp manifest.json dist/
            echo "✓ Copied manifest.json"
          fi
          
          # Copy icons directory
          if [ -d icons ]; then
            cp -r icons dist/
            echo "✓ Copied icons/"
          fi
          
          # Copy any other JSON files
          find . -maxdepth 1 -name "*.json" -type f ! -path "./node_modules/*" -exec cp {} dist/ \;
          
          echo ""
          echo "=== Final dist/ contents ==="
          ls -lah dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
