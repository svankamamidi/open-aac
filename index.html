<script>
  // --- IndexedDB Configuration for Word Prediction ---
	const DICT_DB_NAME = 'WordPredictionDB';
	const DICT_STORE_NAME = 'dictionary';
	
	async function initDictDB() {
	    return new Promise((resolve, reject) => {
	        const request = indexedDB.open(DICT_DB_NAME, 1);
	        request.onupgradeneeded = (e) => {
	            const db = e.target.result;
	            if (!db.objectStoreNames.contains(DICT_STORE_NAME)) {
	                // Key is the word itself. We index by frequency to sort predictions.
	                const store = db.createObjectStore(DICT_STORE_NAME, { keyPath: 'word' });
	                store.createIndex('freq', 'freq', { unique: false });
	            }
	        };
	        request.onsuccess = (e) => resolve(e.target.result);
	        request.onerror = (e) => reject(request.error);
	    });
	}
	
	async function saveWordToDB(word) {
	    if (!word || word.trim() === '') return;
	    const cleanWord = word.toLowerCase().trim();
	    
	    try {
	        const db = await initDictDB();
	        const tx = db.transaction(DICT_STORE_NAME, 'readwrite');
	        const store = tx.objectStore(DICT_STORE_NAME);
	        const req = store.get(cleanWord);
	
	        req.onsuccess = () => {
	            let data = req.result;
	            if (data) {
	                data.freq += 1; // Increase frequency if word exists
	            } else {
	                data = { word: cleanWord, freq: 1 }; // Add new word
	            }
	            store.put(data);
	        };
	    } catch (err) {
	        console.error("IndexedDB Dict save error:", err);
	    }
	}
	
	async function getPredictions(prefix, limit = 5) {
	    if (!prefix || prefix.trim() === '') return [];
	    const cleanPrefix = prefix.toLowerCase().trim();
	    
	    try {
	        const db = await initDictDB();
	        return new Promise((resolve) => {
	            const tx = db.transaction(DICT_STORE_NAME, 'readonly');
	            const store = tx.objectStore(DICT_STORE_NAME);
	            const req = store.getAll(); // Fetch all words (fine for typical AAC local dictionaries)
	            
	            req.onsuccess = () => {
	                const allWords = req.result || [];
	                // Filter words that start with prefix and aren't exactly the prefix itself
	                const matches = allWords.filter(item => item.word.startsWith(cleanPrefix) && item.word !== cleanPrefix);
	                // Sort by frequency descending
	                matches.sort((a, b) => b.freq - a.freq);
	                resolve(matches.slice(0, limit).map(m => m.word));
	            };
	        });
	    } catch (err) {
	        console.error("IndexedDB Dict fetch error:", err);
	        return [];
	    }
	}
	
  // --- IndexedDB Configuration for Voice Preference ---
	const VOICE_DB_NAME = 'VoiceConfigDB';
	const VOICE_STORE_NAME = 'settings';
	const VOICE_KEY = 'selectedVoiceName';
	let selectedVoiceName = null;
	
	function initVoiceDB() {
	    return new Promise((resolve, reject) => {
	        const request = indexedDB.open(VOICE_DB_NAME, 1);
	        request.onupgradeneeded = (e) => {
	            const db = e.target.result;
	            if (!db.objectStoreNames.contains(VOICE_STORE_NAME)) {
	                db.createObjectStore(VOICE_STORE_NAME);
	            }
	        };
	        request.onsuccess = (e) => resolve(e.target.result);
	        request.onerror = (e) => reject(e.target.error);
	    });
	}
	
	async function saveVoiceToDB(voiceName) {
	    try {
	        const db = await initVoiceDB();
	        return new Promise((resolve, reject) => {
	            const tx = db.transaction(VOICE_STORE_NAME, 'readwrite');
	            const store = tx.objectStore(VOICE_STORE_NAME);
	            const request = store.put(voiceName, VOICE_KEY);
	            request.onsuccess = () => resolve();
	            request.onerror = () => reject(request.error);
	        });
	    } catch (err) {
	        console.error("IndexedDB save error:", err);
	    }
	}
	
	async function loadVoiceFromDB() {
	    try {
	        const db = await initVoiceDB();
	        return new Promise((resolve, reject) => {
	            const tx = db.transaction(VOICE_STORE_NAME, 'readonly');
	            const store = tx.objectStore(VOICE_STORE_NAME);
	            const request = store.get(VOICE_KEY);
	            request.onsuccess = () => resolve(request.result);
	            request.onerror = () => reject(request.error);
	        });
	    } catch (err) {
	        console.error("IndexedDB load error:", err);
	        return null;
	    }
	}
	
	// --- Voice Setup and Dialog Rendering Logic ---
	
	// Helper to look up the complete Voice object from the saved name string
	function getSelectedVoiceObject() {
	    if (!selectedVoiceName) return null;
	    const voices = window.speechSynthesis.getVoices();
	    return voices.find(v => v.name === selectedVoiceName) || null;
	}
	
	function populateVoiceList() {
	    const voices = window.speechSynthesis.getVoices();
	    const $list = $('#voiceList').empty();
	
	    if (voices.length === 0) {
	        $list.html('<div style="padding:10px; text-align:center;">No voices available. Try checking back in a moment.</div>');
	        return;
	    }
	    
	    voices.forEach(voice => {
	        const $item = $('<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee;"></div>');
	        
	        // Radio input setup
	        const $label = $('<label style="cursor: pointer; flex: 1; display: flex; align-items: center; font-size: 16px; margin: 0;"></label>');
	        const $radio = $(`<input type="radio" name="appVoice" value="${voice.name}" style="margin-right: 10px; transform: scale(1.2);">`);
	        
	        if (voice.name === selectedVoiceName) {
	            $radio.prop('checked', true);
	        }
	        
	        $label.append($radio).append(`<span>${voice.name} (${voice.lang})</span>`);
	        
	        // Voice preview feature
	        const $previewBtn = $('<button type="button" style="padding: 4px 10px; font-size: 14px; border-radius: 4px; cursor: pointer;">Preview</button>');
	        $previewBtn.on('click', (e) => {
	            e.stopPropagation(); // Avoid checking the row's radio box
	            window.speechSynthesis.cancel();
	            const utterance = new SpeechSynthesisUtterance("Testing this voice option.");
	            utterance.voice = voice;
	            window.speechSynthesis.speak(utterance);
	        });
	        
	        $item.append($label).append($previewBtn);
	        $list.append($item);
	    });
	}
	
	// --- Document Ready Initializations ---
	$(document).ready(async function() {
	    
	    // 1. App Initialization: Restore voice settings from IndexedDB
	    selectedVoiceName = await loadVoiceFromDB();
	
	    // 2. Handle voice load race conditions (especially important in Chrome)
	    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
	        speechSynthesis.onvoiceschanged = () => {
	            if ($('#voiceDialog').is(':visible')) {
	                populateVoiceList();
	            }
	        };
	    }
	
	    // 3. Initialize jQuery UI voice choice dialog
	    $('#voiceDialog').dialog({
	        autoOpen: false,
	        modal: true,
	        width: 450,
	        buttons: {
	            "Select": async function() {
	                const checkedVoice = $('input[name="appVoice"]:checked').val();
	                if (checkedVoice) {
	                    selectedVoiceName = checkedVoice;
	                    await saveVoiceToDB(selectedVoiceName);
	                }
	                $(this).dialog("close");
	            },
	            "Cancel": function() {
	                window.speechSynthesis.cancel();
	                $(this).dialog("close");
	            }
	        }
	    });
	
	    // 4. Attach click listener to your selector button
	    $('#chooseVoiceBtn').on('click', function() {
	        populateVoiceList();
	        $('#voiceDialog').dialog('open');
	    });
	});

  const customStorage = {
    _data: {},
    getItem(key) {
      return this._data.hasOwnProperty(key) ? this._data[key] : null;
    },
    setItem(key, value) {
      this._data[key] = String(value);
      if (this.db) {
        const tx = this.db.transaction("keyval", "readwrite");
        tx.objectStore("keyval").put(this._data[key], key);
      }
    },
    removeItem(key) {
      delete this._data[key];
      if (this.db) {
        const tx = this.db.transaction("keyval", "readwrite");
        tx.objectStore("keyval").delete(key);
      }
    },
    clear() {
      this._data = {};
      if (this.db) {
        const tx = this.db.transaction("keyval", "readwrite");
        tx.objectStore("keyval").clear();
      }
    },
    initPromise: null,
    async init() {
      if (this.initPromise) return this.initPromise;
      this.initPromise = new Promise((resolve, reject) => {
        const req = window.indexedDB.open("MyAAC_DB", 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("keyval")) {
            db.createObjectStore("keyval");
          }
        };
        req.onsuccess = async (e) => {
          const db = e.target.result;
          this.db = db;
          
          // --- BEGIN MIGRATION CODE (Transfer existing objects to IndexedDB) ---
          // TODO: Remove this block later once migration is complete across users
          const txMigrate = db.transaction("keyval", "readwrite");
          const storeMigrate = txMigrate.objectStore("keyval");
          const keysToMigrate = ["aacSettings", "email", "ul-level-1", "freeUsageCount"];
          
          await new Promise(res => {
            let processed = 0;
            if (keysToMigrate.length === 0) res();
            keysToMigrate.forEach(key => {
              const reqGet = storeMigrate.get(key);
              reqGet.onsuccess = () => {
                const oldVal = window.localStorage.getItem(key);
                // If not in IndexedDB but in window.localStorage, transfer it
                if (reqGet.result === undefined && oldVal !== null) {
                  storeMigrate.put(oldVal, key);
                  this._data[key] = oldVal;
                
                    window.localStorage.removeItem(key);
                  } else if (reqGet.result !== undefined) {
                  this._data[key] = reqGet.result;
                
                    if (oldVal !== null) {
                      window.localStorage.removeItem(key);
                    }
                  }
                
                processed++;
                if (processed === keysToMigrate.length) res();
              };
              reqGet.onerror = () => {
                const oldVal = window.localStorage.getItem(key);
                if (oldVal !== null) this._data[key] = oldVal;
                processed++;
                if (processed === keysToMigrate.length) res();
              };
            });
          });
          // --- END MIGRATION CODE ---
          
          // Load all remaining data into memory
          const txLoad = db.transaction("keyval", "readonly");
          const storeLoad = txLoad.objectStore("keyval");
          const reqAll = storeLoad.openCursor();
          reqAll.onsuccess = (e) => {
            const cursor = e.target.result;
            if (cursor) {
              this._data[cursor.key] = cursor.value;
              cursor.continue();
            } else {
              resolve();
            }
          };
          reqAll.onerror = (e) => reject(e.target.error);
        };
        req.onerror = (e) => reject(e.target.error);
      });
      return this.initPromise;
    }
  };

  
	
  async function verifyEmailMatchesGUID(email, providedGUID) {
    const encoder = new TextEncoder();
    const idData = encoder.encode(email.toLowerCase().trim());
    const idHash = await crypto.subtle.digest('SHA-256', idData);
    const idHex = Array.from(new Uint8Array(idHash)).map(b => b.toString(16).padStart(2, '0')).join('');

    // Reconstruct what the ID part SHOULD look like
    const expectedPrefix = [
        idHex.substring(0, 8),
        idHex.substring(8, 12),
        idHex.substring(12, 16),
        idHex.substring(16, 20)
    ].join('-');

    // Check if the provided GUID starts with the correct ID for that email
    return providedGUID.startsWith(expectedPrefix);
  }

  // Simple function to decode the JWT and get user info
  function decodeJwtResponse(token) {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));

    return JSON.parse(jsonPayload);
  }

const dragAndDropManager = (function() {
  const targetSelector = 'ul#ul-level-1';
  let ul = null;
  let items = [];
  let activeItem = null;
  let ghost = null;
  let initialX = 0;
  let initialY = 0;
  let ghostInitialLeft = 0;
  let ghostInitialTop = 0;
  let isEnabled = false;
  let isWaitingForDOM = false;

  const styleEl = document.createElement('style');
  styleEl.id = 'dnd-mobile-styles';
  const cssRules = `
    ul#ul-level-1 li {
      touch-action: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }
  `;

  function handleTouchStart(e) {
    if (!isEnabled) return;
    activeItem = e.target.closest('li');
    if (!activeItem) return;

    const touch = e.touches[0];
    initialX = touch.clientX;
    initialY = touch.clientY;
    
    const rect = activeItem.getBoundingClientRect();
    ghostInitialLeft = rect.left;
    ghostInitialTop = rect.top;

    ghost = activeItem.cloneNode(true);
    Object.assign(ghost.style, {
      position: 'fixed',
      top: `${rect.top}px`,
      left: `${rect.left}px`,
      width: `${rect.width}px`,
      height: `${rect.height}px`,
      opacity: '0.9',
      pointerEvents: 'none',
      zIndex: '9999',
      boxShadow: '0 8px 16px rgba(0,0,0,0.4)',
      margin: '0',
      backgroundColor: window.getComputedStyle(activeItem).backgroundColor || 'white'
    });
    
    document.body.appendChild(ghost);
    activeItem.style.visibility = 'hidden';
  }

  function handleTouchMove(e) {
    if (!isEnabled || !activeItem || !ghost) return;
    if (e.cancelable) e.preventDefault();

    const touch = e.touches[0];
    const deltaX = touch.clientX - initialX;
    const deltaY = touch.clientY - initialY;
    
    // UPDATED: Move ghost in BOTH directions
    ghost.style.left = `${ghostInitialLeft + deltaX}px`;
    ghost.style.top = `${ghostInitialTop + deltaY}px`;

    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    const overElement = target?.closest('li');
    
    if (overElement && overElement !== activeItem && overElement.parentElement === ul) {
      const rect = overElement.getBoundingClientRect();
      const midpointX = rect.left + rect.width / 2;
      const midpointY = rect.top + rect.height / 2;
      
      // UPDATED: Logic to handle both rows and columns
      // If we are significantly above the item, insert before.
      // If we are in the same row, check if we are before the horizontal midpoint.
      const isBefore = (touch.clientY < rect.top + rect.height * 0.25) || 
                       (touch.clientY < rect.bottom && touch.clientX < midpointX);

      if (isBefore) {
        ul.insertBefore(activeItem, overElement);
      } else {
        ul.insertBefore(activeItem, overElement.nextSibling);
      }
    }
  }

  function handleTouchEnd() {
    if (activeItem) activeItem.style.visibility = 'visible';
    if (ghost) {
      ghost.remove();
      ghost = null;
    }
    activeItem = null;
	reOrderLevel(tree.find(getParentKey()));
	saveFromTree();
  }

  function setupListeners() {
    ul = document.querySelector(targetSelector);
    if (!ul) return false;
    
    items = ul.querySelectorAll('li');
    if (items.length === 0) return false;

    styleEl.innerHTML = cssRules;
    document.head.appendChild(styleEl);

    items.forEach(item => {
      item.addEventListener('touchstart', handleTouchStart, { passive: false });
      item.addEventListener('touchmove', handleTouchMove, { passive: false });
      item.addEventListener('touchend', handleTouchEnd);
      item.addEventListener('touchcancel', handleTouchEnd);
    });
    return true;
  }

  return {
    enable: function() {
      if (isEnabled) return;
      if (setupListeners()) {
        isEnabled = true;
      } else if (!isWaitingForDOM) {
        isWaitingForDOM = true;
        const observer = new MutationObserver((mutations, obs) => {
          if (setupListeners()) {
            isEnabled = true;
            isWaitingForDOM = false;
            obs.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }
    },
    disable: function() {
      isEnabled = false;
      isWaitingForDOM = false; 
      if (styleEl.parentNode) styleEl.parentNode.removeChild(styleEl);
      if (items) {
        items.forEach(item => {
          item.removeEventListener('touchstart', handleTouchStart);
          item.removeEventListener('touchmove', handleTouchMove);
          item.removeEventListener('touchend', handleTouchEnd);
          item.removeEventListener('touchcancel', handleTouchEnd);
        });
      }
    }
  };
})();

    class TreeNode {
  constructor(key, value = key, parent = null) {
    this.key = key;
    this.value = value;
    this.parent = parent;
    this.children = [];
  }

  get isLeaf() {
    return this.children.length === 0;
  }

  get hasChildren() {
    return !this.isLeaf;
  }
}

class Tree {
  constructor(key, value = key) {
    this.root = new TreeNode(key, value);
  }

  *preOrderTraversal(node = this.root) {
    yield node;
    if (node.children.length) {
      for (let child of node.children) {
        yield* this.preOrderTraversal(child);
      }
    }
  }

  *postOrderTraversal(node = this.root) {
    if (node.children.length) {
      for (let child of node.children) {
        yield* this.postOrderTraversal(child);
      }
    }
    yield node;
  }

  swapNodesByKeys(key1, key2){
	var node1 = tree.find(key1);
	var node2 = tree.find(key2);
	var tempNode = tree.find(key1);
    node1.key = node2.name;
    node1.value.name = node2.name;
    node1.value.image = node2.image;
	node1.value.type = node2.value.type;
	node1.value.value = node2.value.value;
	node2.key = tempNode.name;
    node2.value.name = tempNode.name;
    node2.value.image = tempNode.image;
	node2.value.type = tempNode.value.type;
	node2.value.value = tempNode.value.value;
  }
	
  update(key, updatedNode){
    var currentNode = tree.find(key);
    currentNode.key = updatedNode.name;
    currentNode.value.name = updatedNode.name;
    currentNode.value.image = updatedNode.image;
  }
	
  insert(parentNodeKey, key, value = key) {
    for (let node of this.preOrderTraversal()) {
      if (node.key === parentNodeKey) {
        node.children.push(new TreeNode(key, value, node));
        return true;
      }
    }
    return false;
  }

  remove(key) {
    for (let node of this.preOrderTraversal()) {
      const filtered = node.children.filter(c => c.key !== key);
      if (filtered.length !== node.children.length) {
        node.children = filtered;
        return true;
      }
    }
    return false;
  }

  find(key) {
    for (let node of this.preOrderTraversal()) {
      if (node.key === key) return node;
    }
    return undefined;
  }
}

function reOrderLevel(node) {
  if (!node || !node.children) return;

  // 1. Get the current order of text values from the DOM
  const ul = document.querySelector('ul#ul-level-1');
  const currentLiOrder = Array.from(ul.querySelectorAll('li')).map(li => li.textContent.trim());

  // 2. Sort the children array based on the index in the currentLiOrder array
  node.children.sort((a, b) => {
    const indexA = currentLiOrder.indexOf(a.value.name.trim());
    const indexB = currentLiOrder.indexOf(b.value.name.trim());
    
    // Safety check: if an item is not found in the DOM, move it to the end
    if (indexA === -1) return 1;
    if (indexB === -1) return -1;
    
    return indexA - indexB;
  });

  console.log('Tree children reordered:', node.children.map(c => c.name));
  return node;
}

  /* recursively builds the folder hierarchy path */
  function buildBreadCrumbPath(folderItem, level){
    var breadCrumbs = [];
    if (level <= 1){
      return breadCrumbs;
    }else if (level > 1){
      breadCrumbs.push(folderItem.name);
      var parent = tree.find(folderItem.name + (level-1));
      if (parent && parent.parent){
        breadCrumbs.concat(buildBreadCrumbPath(parent.parent.value, level-2));
      }
    }
    return breadCrumbs;
  }
	
  function updateBreadCrumbs(folderItem){
	var ul = document.getElementById("ul-bread-crumbs");

      	  var li = document.createElement("li");

  function dataURItoBlob(dataURI) {
    // convert base64 to raw binary data held in a string
    // doesn't handle URLEncoded DataURIs - see SO answer #6850276 for code that does this
    var byteString = atob(dataURI.split(',')[1]);

    // separate out the mime component
    var mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0]

    // write the bytes of the string to an ArrayBuffer
    var ab = new ArrayBuffer(byteString.length);

    // create a view into the buffer
    var ia = new Uint8Array(ab);

    // set the bytes of the buffer to the correct values
    for (var i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
    }

    // write the ArrayBuffer to a blob, and you're done
    var blob = new Blob([ab], {type: mimeString});
    return blob;

  }

document.addEventListener('DOMContentLoaded', () => {
	    const kbElement = document.getElementById('keyboard');
    
    // Only proceed if the keyboard exists to avoid errors
    if (kbElement) {
        let touchStartY = 0;

        // Capture the starting point of the touch
        kbElement.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        // Calculate the movement and scroll the window
        kbElement.addEventListener('touchmove', (e) => {
            const touchY = e.touches[0].clientY;
            const touchDelta = touchStartY - touchY;

            // Scroll the main window
            window.scrollBy(0, touchDelta);

            // Update start position for smooth continuous scrolling
            touchStartY = touchY;
        }, { passive: true });
        
        console.log("Keyboard swipe-to-scroll initialized.");
    }
	
    let isUppercase = false;
    let typedText = ""; // Holds the typed text

    // Toggle uppercase
    /*document.querySelector('.uppercase-toggle').addEventListener('click', () => {
        isUppercase = !isUppercase;
        document.querySelectorAll('.row .key').forEach(button => {
            if (button.innerText.match(/[a-zA-Z]/)) {
                button.innerText = isUppercase ? button.innerText.toUpperCase() : button.innerText.toLowerCase();
            }
        });
    });*/

    let isCapsLock = true; // Tracks the state of Caps Lock (defaulting to true to match HTML)

    // Add event listener to each key
    document.querySelectorAll('.keyboard .key').forEach(button => {
        button.addEventListener('click', (event) => {
			// Add a tiny haptic pulse (10ms) for mobile feel
            if (navigator.vibrate) navigator.vibrate(10);
			
            // Ignore action/navigation keys so they don't type into the text area
            if (event.target.classList.contains('action-key')) return;

            const key = event.target.innerText;
			let keyText = key.toLowerCase();
			let typedStr = document.getElementById("textareaEle").value?.trim();
			if (!typedStr){
				typedText = '';
			}
            
            if (keyText === "enter") {
                console.log("Enter Key Pressed");
                typedText += "\n";
            } else if (keyText === "space") {
                console.log("Space Bar Pressed");
                typedText += " ";
            } else if (keyText === 'backspace' || keyText === '⌫') {
                typedText = typedText.slice(0, -1);
            } else if (keyText === 'caps') {
                isCapsLock = !isCapsLock;
                
                // Add a subtle background highlight to the Caps key when active
                event.target.style.backgroundColor = isCapsLock ? 'rgba(128, 128, 128, 0.4)' : '';
                
                // Dynamically update the visual text of all letter keys to upper/lower case
                document.querySelectorAll('.keyboard .key').forEach(k => {
                    if (k.innerText.length === 1 && k.innerText.match(/[a-zA-Z]/)) {
                        k.innerText = isCapsLock ? k.innerText.toUpperCase() : k.innerText.toLowerCase();
                    }
                });
            } else { 
                typedText += key; // Grabs the exact current casing visible on the key
            }
            
	        document.getElementById("textareaEle").value = typedText;
		    promptItem(key);
            console.log("Typed Text: " + typedText);
        });
    });

<div id='addMessageOrFolderDialog' style="display:none">

	<form>
		<fieldset>
			<label for="name">Name</label>
			<input type="text" name="name" id="name" class="text ui-widget-content ui-corner-all" style="margin-bottom: 20px" onfocusout="updateSearchVal(this)">

			  <label for="search-name">Search</label>
			  <input type="text" name="search-name" id="search-name" class="text ui-widget-content ui-corner-all" style="margin-bottom: 20px" onfocusout="doImgSearch()">
			  <input type="button" value="Search" style="margin-bottom: 20px"/>
			</div>
			<div style="display: flex">
			  <label for="itemPhoto">Picture</label>
			  <input type="file" id="uploadItemPhoto" style="margin-left: 10px" onchange="displayPicture()"/>
			</div>
			<img name="itemPhoto" id="itemPhoto" style="width: 50%; height: 50%; margin-top: 20px; border:0px"/>			
			<input type="button" id="left-nav-img-search" value="Prev" onclick="fetchPrev()"/>
			<input type="button" id="right-nav-img-search" value="Next" onclick="fetchNext()"/>

			<input type="submit" tabindex="-1" style="position:absolute; top:-1000px">
		</fieldset>
	</form>
</div>
