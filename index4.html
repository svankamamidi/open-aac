    async function verifyEmailMatchesGUID(email, providedGUID) {
        const encoder = new TextEncoder();
        const idData = encoder.encode(email.toLowerCase().trim());
        const idHash = await crypto.subtle.digest('SHA-256', idData);
        const idHex = Array.from(new Uint8Array(idHash)).map(b => b.toString(16).padStart(2, '0')).join('');

        const expectedPrefix = [
            idHex.substring(0, 8),
            idHex.substring(8, 12),
            idHex.substring(12, 16),
            idHex.substring(16, 20)
        ].join('-');

        return providedGUID.startsWith(expectedPrefix);
    }

    async function handleCredentialResponse(response) {
        const responsePayload = decodeJwtResponse(response.credential);

        console.log("ID: " + responsePayload.sub);
        console.log('Full Name: ' + responsePayload.name);
        console.log('Email: ' + responsePayload.email);
        if (ALLOWED_EMAILS.includes(responsePayload.email)) {
            localStorage.setItem("email", responsePayload.email);
        } else {
            let providedGuid = prompt("Please enter your guid:");
            const isValid = await verifyEmailMatchesGUID(responsePayload.email, providedGuid);
            if (isValid) {
                localStorage.setItem("email", responsePayload.email);
                document.getElementById("signInButtonDiv").style.display = "none";
                location.reload();
            } else {
                alert("Verification failed, try again with registered email");
                document.getElementById("signInButtonDiv").style.display = "table";
            }
        }
    }

        });

            document.getElementById("signInButtonDiv"),

        );
        google.accounts.id.prompt();
    }

    function decodeJwtResponse(token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function (c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));

        return JSON.parse(jsonPayload);
    }

<script>

    const dragAndDropManager = (function () {
        const targetSelector = 'ul#ul-level-1';
        let ul = null;
        let items = [];
        let activeItem = null;
        let ghost = null;
        let initialX = 0;
        let initialY = 0;
        let ghostInitialLeft = 0;
        let ghostInitialTop = 0;
        let isEnabled = false;
        let isWaitingForDOM = false;

        const styleEl = document.createElement('style');
        styleEl.id = 'dnd-mobile-styles';
        const cssRules = `
            ul#ul-level-1 li {
              touch-action: none !important;
              user-select: none !important;
              -webkit-user-select: none !important;
              -webkit-tap-highlight-color: transparent !important;
            }
        `;

        function handleTouchStart(e) {
            if (!isEnabled) return;
            activeItem = e.target.closest('li');
            if (!activeItem) return;

            const touch = e.touches[0];
            initialX = touch.clientX;
            initialY = touch.clientY;

            const rect = activeItem.getBoundingClientRect();
            ghostInitialLeft = rect.left;
            ghostInitialTop = rect.top;

            ghost = activeItem.cloneNode(true);
            Object.assign(ghost.style, {
                position: 'fixed',
                top: `${rect.top}px`,
                left: `${rect.left}px`,
                width: `${rect.width}px`,
                height: `${rect.height}px`,
                opacity: '0.9',
                pointerEvents: 'none',
                zIndex: '9999',
                boxShadow: '0 8px 16px rgba(0,0,0,0.4)',
                margin: '0',
                backgroundColor: window.getComputedStyle(activeItem).backgroundColor || 'white'
            });

            document.body.appendChild(ghost);
            activeItem.style.visibility = 'hidden';
        }

        function handleTouchMove(e) {
            if (!isEnabled || !activeItem || !ghost) return;
            if (e.cancelable) e.preventDefault();

            const touch = e.touches[0];
            const deltaX = touch.clientX - initialX;
            const deltaY = touch.clientY - initialY;

            ghost.style.left = `${ghostInitialLeft + deltaX}px`;
            ghost.style.top = `${ghostInitialTop + deltaY}px`;

            const target = document.elementFromPoint(touch.clientX, touch.clientY);
            const overElement = target?.closest('li');

            if (overElement && overElement !== activeItem && overElement.parentElement === ul) {
                const rect = overElement.getBoundingClientRect();
                const midpointX = rect.left + rect.width / 2;
                const midpointY = rect.top + rect.height / 2;

                const isBefore = (touch.clientY < rect.top + rect.height * 0.25) ||
                    (touch.clientY < rect.bottom && touch.clientX < midpointX);

                if (isBefore) {
                    ul.insertBefore(activeItem, overElement);
                } else {
                    ul.insertBefore(activeItem, overElement.nextSibling);
                }
            }
        }

        function handleTouchEnd() {
            if (activeItem) activeItem.style.visibility = 'visible';
            if (ghost) {
                ghost.remove();
                ghost = null;
            }
            activeItem = null;
            reOrderLevel(tree.find(getParentKey()));
            saveFromTree();
        }

        function setupListeners() {
            ul = document.querySelector(targetSelector);
            if (!ul) return false;

            items = ul.querySelectorAll('li');
            if (items.length === 0) return false;

            styleEl.innerHTML = cssRules;
            document.head.appendChild(styleEl);

            items.forEach(item => {
                item.addEventListener('touchstart', handleTouchStart, { passive: false });
                item.addEventListener('touchmove', handleTouchMove, { passive: false });
                item.addEventListener('touchend', handleTouchEnd);
                item.addEventListener('touchcancel', handleTouchEnd);
            });
            return true;
        }

        return {
            enable: function () {
                if (isEnabled) return;
                if (setupListeners()) {
                    isEnabled = true;
                } else if (!isWaitingForDOM) {
                    isWaitingForDOM = true;
                    const observer = new MutationObserver((mutations, obs) => {
                        if (setupListeners()) {
                            isEnabled = true;
                            isWaitingForDOM = false;
                            obs.disconnect();
                        }
                    });
                    observer.observe(document.body, { childList: true, subtree: true });
                }
            },
            disable: function () {
                isEnabled = false;
                isWaitingForDOM = false;
                if (styleEl.parentNode) styleEl.parentNode.removeChild(styleEl);
                if (items) {
                    items.forEach(item => {
                        item.removeEventListener('touchstart', handleTouchStart);
                        item.removeEventListener('touchmove', handleTouchMove);
                        item.removeEventListener('touchend', handleTouchEnd);
                        item.removeEventListener('touchcancel', handleTouchEnd);
                    });
                }
            }
        };
    })();

        renderKeyboard: function () {
            const keyboard = document.getElementById('keyboard');

            const layout = this.layouts[this.currentLayout];

            const rowSize = this.currentLayout === 'symbols' ? 9 : 10;

                    keyDiv.style.color = this.keyboardTheme.color;
                    keyDiv.onclick = () => this.handleKeyPress(key);
                    rowDiv.appendChild(keyDiv);

                controlRow.appendChild(shiftBtn);

            const spaceBtn = document.createElement('button');
            spaceBtn.className = 'key space-bar';
            spaceBtn.textContent = 'Space';
            spaceBtn.style.flex = '4';
            spaceBtn.style.backgroundColor = this.keyboardTheme.background;
            spaceBtn.style.color = this.keyboardTheme.color;
            spaceBtn.onclick = () => this.handleKeyPress(' ');
            controlRow.appendChild(spaceBtn);

            const enterBtn = document.createElement('button');
            enterBtn.className = 'key';
            enterBtn.textContent = 'Enter';
            enterBtn.style.flex = '1.5';
            enterBtn.style.backgroundColor = this.keyboardTheme.background;
            enterBtn.style.color = this.keyboardTheme.color;
            enterBtn.onclick = () => this.handleKeyPress('\n');
            controlRow.appendChild(enterBtn);

            document.getElementById('keyboard').appendChild(controlRow);

            this.attachModeButtons();
        },

        attachModeButtons: function () {
            const keyboard = document.getElementById('keyboard');
            let modeRow = document.querySelector('.keyboard-mode-row');

            if (!modeRow) {
                modeRow = document.createElement('div');
                modeRow.className = 'keyboard-mode-row';
                keyboard.appendChild(modeRow);
            } else {
                modeRow.innerHTML = '';
            }

            const modes = [
                { label: 'ABC', layout: 'abc' },
                { label: '123', layout: 'numbers' },
                { label: '#@$', layout: 'symbols' },
                { label: 'QWERTY', layout: 'qwerty' },
                { label: 'Emojis', layout: 'emojis' },
                { label: '⚙ Settings', action: 'settings' }
            ];

            modes.forEach(mode => {
                const btn = document.createElement('button');
                btn.className = 'keyboard-mode-btn';
                if (mode.layout === this.currentLayout) {
                    btn.classList.add('active');
                }
                btn.textContent = mode.label;
                btn.onclick = () => {
                    if (mode.action === 'settings') {
                        this.openThemeDialog();
                    } else {
                        this.currentLayout = mode.layout;
                        this.isUppercase = false;
                        this.renderKeyboard();
                    }
                };
                modeRow.appendChild(btn);
            });
        },

        handleKeyPress: function (key) {
            const textarea = document.getElementById('textareaEle');
            if (textarea) {
                textarea.value += key;
            }
        },

        handleBackspace: function () {
            const textarea = document.getElementById('textareaEle');
            if (textarea) {
                textarea.value = textarea.value.slice(0, -1);
            }
        },

        toggleUppercase: function () {
            this.isUppercase = !this.isUppercase;
            this.renderKeyboard();
        },

        loadTheme: function () {
            const saved = localStorage.getItem('keyboardTheme');
            if (saved) {
                this.keyboardTheme = JSON.parse(saved);
            } else {
                this.keyboardTheme = { background: '#000', color: '#fff' };
            }

        saveTheme: function () {
            localStorage.setItem('keyboardTheme', JSON.stringify(this.keyboardTheme));

        openThemeDialog: function () {

            const dialog = $('<div>')
                .html(`<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">${html}</div>`)
                .dialog({

            this.keyboardTheme = { background: theme.bg, color: theme.color };
            this.saveTheme();
            this.renderKeyboard();

            this.key = key;
            this.value = value;
            this.parent = parent;
            this.children = [];
        }

        get isLeaf() {
            return this.children.length === 0;
        }

        get hasChildren() {
            return !this.isLeaf;
        }
    }

    class Tree {
        constructor(key, value = key) {
            this.root = new TreeNode(key, value);
        }

        *preOrderTraversal(node = this.root) {
            yield node;
            if (node.children.length) {
                for (let child of node.children) {
                    yield* this.preOrderTraversal(child);
                }
            }
        }

        *postOrderTraversal(node = this.root) {
            if (node.children.length) {
                for (let child of node.children) {
                    yield* this.postOrderTraversal(child);
                }
            }
            yield node;
        }

        swapNodesByKeys(key1, key2) {
            var node1 = tree.find(key1);
            var node2 = tree.find(key2);
            var tempNode = tree.find(key1);
            node1.key = node2.name;
            node1.value.name = node2.name;
            node1.value.image = node2.image;
            node1.value.type = node2.value.type;
            node1.value.value = node2.value.value;
            node2.key = tempNode.name;
            node2.value.name = tempNode.name;
            node2.value.image = tempNode.image;
            node2.value.type = tempNode.value.type;
            node2.value.value = tempNode.value.value;
        }

        update(key, updatedNode) {
            var currentNode = tree.find(key);
            currentNode.key = updatedNode.name;
            currentNode.value.name = updatedNode.name;
            currentNode.value.image = updatedNode.image;
        }

        insert(parentNodeKey, key, value = key) {
            for (let node of this.preOrderTraversal()) {
                if (node.key === parentNodeKey) {
                    node.children.push(new TreeNode(key, value, node));
                    return true;
                }
            }
            return false;
        }

        remove(key) {
            for (let node of this.preOrderTraversal()) {
                const filtered = node.children.filter(c => c.key !== key);
                if (filtered.length !== node.children.length) {
                    node.children = filtered;
                    return true;
                }
            }
            return false;
        }

        find(key) {
            for (let node of this.preOrderTraversal()) {
                if (node.key === key) return node;
            }
            return undefined;
        }
    }

    let globalSettings = new Settings();
    let tree = new Tree(1, 'root');
    let mainMenuMap = new Map();
    let ROOT = {};
    ROOT.name = 'root';

    function reOrderLevel(node) {
        if (!node || !node.children) return;

        const ul = document.querySelector('ul#ul-level-1');
        const currentLiOrder = Array.from(ul.querySelectorAll('li')).map(li => li.textContent.trim());

        node.children.sort((a, b) => {
            const indexA = currentLiOrder.indexOf(a.value.name.trim());
            const indexB = currentLiOrder.indexOf(b.value.name.trim());

            if (indexA === -1) return 1;
            if (indexB === -1) return -1;

            return indexA - indexB;
        });

        console.log('Tree children reordered:', node.children.map(c => c.name));
        return node;
    }

    function renderTextItem(item) {
        var ul = document.getElementById("ul-level-1");
        var li = createItemLi();
        li.classList.add("leaf-item");
        var liElement = document.createTextNode(item);
        if (item.image && item.image !== "No picture") {
            liElement.style.backgroundImage = "url(item.image)"
        }
        li.appendChild(liElement);
        ul.appendChild(li);
    }

    function renderItems(item) {
        switch (typeof (item)) {
            case 'object':
                renderItem(item);
                break;
            case 'string':
                renderTextItem(item)
                break;
        }
    }

    function renderItem(item) {
        var ul = document.getElementById("ul-level-1");
        var li = createItemLi(item);
        var liElement = document.createTextNode(item.name);
        if (item.image && item.image !== "No picture") {
            li.style.backgroundImage = 'url(' + item.image + ')';
            li.style.backgroundSize = '100% 85%';
            li.style.backgroundRepeat = 'no-repeat';
            li.style.backgroundPosition = 'center bottom';
        }
        li.appendChild(liElement);
        ul.appendChild(li);
        if (item.type && item.type === 'folder') {
            li.classList.add("folder-item");
        } else {
            li.classList.add("leaf-item");
        }
    }

    function loadGivenLevel(levelItems) {
        levelItems && Array.isArray(levelItems) && levelItems.forEach(item => {
            mainMenuMap.set(item.value.name, item.value);
            renderItems(item.value);
        });
    }

    function loadFile(filePath) {
        var result = null;
        var xmlhttp = new XMLHttpRequest();
        xmlhttp.open("GET", filePath, false);
        xmlhttp.send();
        if (xmlhttp.status == 200) {
            result = xmlhttp.responseText;
        }
        return result;
    }

    function loadSavedLevelsFromCache() {
        var localStorage = window.localStorage;
        tree = new Tree(1, 'root');
        var levelItems = localStorage.getItem("ul-level-1") && JSON.parse(localStorage.getItem("ul-level-1"));
        levelItems && Array.isArray(levelItems) && levelItems.forEach(item => {
            tree.insert(1, item.name + "1", item);
            traverseStoredTreeAndCreateNodes(item, ROOT, 1);
            mainMenuMap.set(item.name, item);
            renderItems(item);
        });
        globalSettings.currentLevel = 1;
    }

    function traverseStoredTreeAndCreateNodes(startNode, parentNode, level) {
        var localLevel = level + 1;
        startNode.value && startNode.value.forEach(item => {
            if (item.type === 'message') {
                tree.insert(startNode.name + level, item.name + localLevel, item);
            } else if (item.type === 'folder') {
                tree.insert(startNode.name + level, item.name + localLevel, item);
                traverseStoredTreeAndCreateNodes(item, startNode, localLevel);
            }
        })
    }

    function createItemLi(item) {
        var li = document.createElement("li");
        li.setAttribute("id", "li" + item.name);
        li.addEventListener('click', function (event) {
            handleItemClick(li, item, event);
        });
        return li;
    }

    function handleItemClick(liElement, item, event) {
        globalSettings.settingsClickCount = 0;
        if (item.type && item.type == 'folder') {
            globalSettings.parentItem = item;
            globalSettings.currentFolder = globalSettings.parentItem;
        } else {
            if (!globalSettings.parentItem) {
                globalSettings.parentItem = 'root';
            }
            if (globalSettings.currentItem && globalSettings.currentItem.type === 'folder' && globalSettings.currentItem.parent === globalSettings.parentItem) {
                globalSettings.parentItem = globalSettings.currentItem;
            }
            globalSettings.currentFolder = globalSettings.parentItem;
        }
        globalSettings.currentItem = item;
        if (globalSettings && globalSettings.adminMode) {
            handleItemEdit(liElement, event);
        } else {
            promptItem(liElement.innerText);
            if (item.type && item.type === 'folder') {
                displayFolderMenu(item);
                globalSettings.currentLevel = globalSettings.currentLevel + 1;
            } else {
                var spaceChar;
                if (document.getElementById("textareaEle").value) {
                    spaceChar = " ";
                } else {
                    spaceChar = "";
                }
                document.getElementById("textareaEle").value = document.getElementById("textareaEle").value + spaceChar + liElement.innerText;
            }
        }
    }

    function downloadFile(content, fileName, mimeType) {
        const link = document.createElement("a");
        const file = new Blob([content], { type: mimeType });
        link.href = URL.createObjectURL(file);
        link.download = fileName;
        link.click();
        URL.revokeObjectURL(link.href);
    }

    function exportConfig() {
        var localStorage = window.localStorage;
        var configJsonStr = localStorage.getItem("ul-level-1");
        downloadFile(configJsonStr, 'aac-config.json', 'application/json');
    }

    function readTextFile(fileElementSelector) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsText(document.querySelector(fileElementSelector).files[0]);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    function importConfig() {
        readTextFile("#importConfigFile").then(configJson => {
            var localStorage = window.localStorage;
            localStorage.setItem("ul-level-1", configJson);
            $("#importConfigDialog").dialog("close");
        });
    }

    function importDialog() {
        $("#importConfigDialog").dialog("open");
    }

    function displayFolderMenu(item) {
        $('#ul-level-1 li').each(function () {
            $(this)[0].remove();
        });
        document.getElementById("backButtonDiv").style.display = "block";
        item && item.value && item.value.forEach(childItem => {
            renderItems(childItem);
            if (!tree.find(childItem.name + (globalSettings.currentLevel + 1))) {
                tree.insert(item.name, childItem.name + (globalSettings.currentLevel + 1), childItem);
            }
        });
        updateBreadCrumbs(item);
    }

    function buildBreadCrumbPath(folderItem, level) {
        var breadCrumbs = [];
        if (level <= 1) {
            return breadCrumbs;
        } else if (level > 1) {
            breadCrumbs.push(folderItem.name);
            var parent = tree.find(folderItem.name + (level - 1));
            if (parent && parent.parent) {
                breadCrumbs.concat(buildBreadCrumbPath(parent.parent.value, level - 2));
            }
        }
        return breadCrumbs;
    }

    function updateBreadCrumbs(folderItem) {
        var ul = document.getElementById("ul-bread-crumbs");
        var breadCrumbs = [];
        breadCrumbs = buildBreadCrumbPath(folderItem, globalSettings.currentLevel + 1);
        for (let i = 0; i < breadCrumbs.length; i++) {
            var li = document.createElement("li");
            var liElement = document.createTextNode(breadCrumbs[i]);
            li.appendChild(liElement);
            ul.appendChild(li);
        }
    }

    function onBackButtonClick() {
        if (globalSettings && globalSettings.currentLevel == 2) {
            document.getElementById("backButtonDiv").style.display = "none";
        }
        $('#ul-level-1 li').each(function () {
            $(this)[0].remove();
        });

        $('#ul-bread-crumbs li').each(function () {
            $(this)[0].remove();
        });

        globalSettings.currentLevel = globalSettings.currentLevel ? globalSettings.currentLevel - 1 : 1;
        if (globalSettings.parentItem && globalSettings.parentItem !== 'root' && globalSettings.parentItem?.parent) {
            globalSettings.currentItem = tree.find(globalSettings.parentItem.parent + (globalSettings.currentLevel - 1)).value;
            globalSettings.parentItem = globalSettings.currentItem.parent;
        } else {
            globalSettings.currentItem = 'root';
            globalSettings.parentItem = 'root';
        }
        if (!globalSettings.currentItem || globalSettings.currentItem === 'root') {
            loadSavedLevelsFromCache();
        } else {
            var item = globalSettings.currentItem;
            item && item.value && item.value.forEach(childItem => {
                renderItems(childItem);
                if (!tree.find(childItem.name + (globalSettings.currentLevel + 1))) {
                    tree.insert(item.name, childItem.name + (globalSettings.currentLevel + 1), childItem);
                }
            });
            updateBreadCrumbs(globalSettings.currentItem);
        }
    }

    function promptItem(words) {
        try {
            var synth = window.speechSynthesis;
            synth.speak(new SpeechSynthesisUtterance(words));
        } catch (e) {
            console.log(e);
        }
    }

    function handleItemEdit(liElement, event) {
        if (globalSettings) {
            globalSettings.currentItemLiEle = liElement;
        }

        $("#item-edit-menu").menu().hide();
        var menu = document.getElementById('item-edit-menu');
        menu.style.position = "absolute";
        menu.style.left = event.x + 'px';
        menu.style.top = event.y + 'px';
        $("#item-edit-menu").show();
    }

    function editItemContents() {
        $("#item-edit-menu").menu().hide();
        $("#name").val(globalSettings.currentItem.name);
        $("#addMessageOrFolderDialog").dialog("open");
        globalSettings.currentAction = "edit";
    }

    function deleteItem() {
        $("#item-edit-menu").menu().hide();
        tree.remove(globalSettings.currentItem.name + globalSettings.currentLevel);
        $(globalSettings.currentItemLiEle).remove();
        saveFromTree();
    }

    function fetchPicBase64(imageTagId) {
        if (document.getElementById(imageTagId) && document.getElementById(imageTagId).src && document.getElementById(imageTagId).src.includes("base64")) {
            return Promise.resolve(document.getElementById(imageTagId).src);
        }
        var picUploadPromise;
        document.querySelector('#uploadItemPhoto').files && Array.from(document.querySelector('#uploadItemPhoto').files).forEach(pictureFile => {
            picUploadPromise = toBase64(pictureFile).then(base64VoiceFile => {
                return base64VoiceFile;
                console.log(base64VoiceFile);
                document.querySelector('#uploadItemPhoto').value = '';
            });
        });
        if (!picUploadPromise) {
            picUploadPromise = Promise.resolve("No picture");
        }
        return picUploadPromise;
    }
</script>
